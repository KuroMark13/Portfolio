    <style>
        /* Custom Customizations & Animations */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #08070b;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(18, 15, 25, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(212, 175, 55, 0.4);
        }

        /* Audio Reactive Pulsing Halo Behind Vinyl */
        .halo-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.5) 0%, rgba(30, 58, 138, 0.3) 45%, rgba(0,0,0,0) 70%);
            filter: blur(30px);
            opacity: 0.4;
            transition: all 0.5s ease;
            transform: scale(0.95);
        }
        .halo-glow.playing {
            opacity: 0.85;
            animation: pulse-halo 3s ease-in-out infinite alternate;
        }

        @keyframes pulse-halo {
            0% {
                transform: scale(0.98) rotate(0deg);
                filter: blur(28px);
                background: radial-gradient(circle, rgba(212, 175, 55, 0.5) 0%, rgba(225, 29, 72, 0.3) 50%, rgba(0,0,0,0) 75%);
            }
            50% {
                transform: scale(1.08) rotate(180deg);
                filter: blur(40px);
                background: radial-gradient(circle, rgba(168, 85, 247, 0.55) 0%, rgba(212, 175, 55, 0.35) 50%, rgba(0,0,0,0) 75%);
            }
            100% {
                transform: scale(1.02) rotate(360deg);
                filter: blur(32px);
                background: radial-gradient(circle, rgba(234, 88, 12, 0.5) 0%, rgba(147, 51, 234, 0.3) 50%, rgba(0,0,0,0) 75%);
            }
        }

        /* Spinning Vinyl Record Styling */
        .vinyl-container {
            perspective: 1000px;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, 
                #111 0%, 
                #111 18%, 
                #d4af37 19%, 
                #d4af37 20%, 
                #090909 21%, 
                #1c1c1c 30%, 
                #0d0d0d 35%, 
                #222 45%, 
                #0d0d0d 55%, 
                #1f1f1f 65%, 
                #0a0a0a 75%, 
                #1a1a1a 85%, 
                #050505 100%);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1);
            animation: spin 16s linear infinite;
            animation-play-state: paused;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Vinyl Grooves & Reflection Overlay */
        .vinyl-reflection {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #D4AF37;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: #fff;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }

        /* Custom Scrollbar for Playlist & Lyrics */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.6);
        }

        /* Lyrics Highlight Animation */
        .lyric-line {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.4;
            transform: scale(0.96);
            transform-origin: left center;
        }
        .lyric-line.active {
            opacity: 1;
            transform: scale(1.04);
            color: #D4AF37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Equalizer Bar Animation */
        .eq-bar {
            width: 3px;
            background-color: #D4AF37;
            border-radius: 3px;
            animation: eqPulse 1.2s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 80%; animation-delay: 0.4s; }

        @keyframes eqPulse {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }
    </style>
</head>

                    { time: 10, text: "Take me back to 2014" },
                    { time: 20, text: "Cold winter nights in Toronto" },
                    { time: 32, text: "Dreaming big before the world knew our names" }
                ]
            }
        ];

        // --- STATE MANAGEMENT ---
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0; // 0: Off, 1: Repeat All, 2: Repeat One
        let themeMode = 'mesh'; // 'mesh', 'stars', 'sunset'

        // Audio Object
        const audio = new Audio();

        // --- DOM ELEMENTS ---
        const albumCover = document.getElementById('album-cover');
        const vinylDisc = document.getElementById('vinyl-disc');
        const haloRing = document.getElementById('halo-ring');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const albumName = document.getElementById('album-name');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const seekBar = document.getElementById('seek-bar');
        const volumeBar = document.getElementById('volume-bar');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const equalizer = document.getElementById('equalizer');
        const playlistView = document.getElementById('playlist-view');
        const lyricsView = document.getElementById('lyrics-view');
        const lyricsLinesContainer = document.getElementById('lyrics-lines-container');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');

        // --- PLAYER CONTROLS ---

        function loadTrack(index) {
            currentIndex = index;
            const track = playlist[index];

            songTitle.innerText = track.title;
            artistName.innerText = track.artist;
            albumName.innerText = track.album;
            albumCover.src = track.cover;
            audio.src = track.audio;

            seekBar.value = 0;
            currentTimeEl.innerText = "0:00";
            totalDurationEl.innerText = track.duration;

            renderPlaylist();
            renderLyrics(track.lyrics);
        }

        function togglePlay() {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        function playTrack() {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                vinylDisc.classList.add('playing');
                haloRing.classList.add('playing');
                equalizer.style.opacity = '1';
                renderPlaylist();
            }).catch(e => console.log('Audio playback interaction needed:', e));
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            pauseIcon.classList.add('hidden');
            playIcon.classList.remove('hidden');
            vinylDisc.classList.remove('playing');
            haloRing.classList.remove('playing');
            equalizer.style.opacity = '0';
            renderPlaylist();
        }

        function playNext() {
            if (isShuffle) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * playlist.length);
                } while (newIndex === currentIndex && playlist.length > 1);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(currentIndex);
            playTrack();
        }

        function playPrev() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            playTrack();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-yellow-400', isShuffle);
            shuffleBtn.classList.toggle('text-gray-400', !isShuffle);
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.className = "text-gray-400 hover:text-yellow-400 transition-colors p-2";
                repeatBtn.title = "Repeat: Off";
            } else if (repeatMode === 1) {
                repeatBtn.className = "text-yellow-400 hover:text-yellow-300 transition-colors p-2";
                repeatBtn.title = "Repeat: Playlist";
            } else {
                repeatBtn.className = "text-amber-500 font-bold hover:text-yellow-300 transition-colors p-2 relative";
                repeatBtn.title = "Repeat: One Track";
            }
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('vol-icon').style.opacity = audio.muted ? '0.3' : '1';
        }

        // --- AUDIO EVENTS ---
        audio.addEventListener('timeupdate', () => {
            if (isNaN(audio.duration)) return;

            // Seekbar update
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.value = progress;

            // Time text
            currentTimeEl.innerText = formatTime(audio.currentTime);
            totalDurationEl.innerText = formatTime(audio.duration);

            // Sync lyrics highlight
            updateLyricsHighlight(audio.currentTime);
        });

        audio.addEventListener('ended', () => {
            if (repeatMode === 2) {
                audio.currentTime = 0;
                playTrack();
            } else {
                playNext();
            }
        });

        seekBar.addEventListener('input', (e) => {
            if (!audio.duration) return;
            const seekTo = (e.target.value / 100) * audio.duration;
            audio.currentTime = seekTo;
        });

        volumeBar.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // --- RENDER FUNCTIONS ---

        function renderPlaylist() {
            playlistView.innerHTML = '';
            playlist.forEach((track, index) => {
                const isActive = index === currentIndex;
                const trackCard = document.createElement('div');
                trackCard.className = `flex items-center gap-4 p-3 rounded-2xl cursor-pointer transition-all duration-300 border ${
                    isActive 
                    ? 'bg-yellow-500/15 border-yellow-500/40 shadow-lg shadow-yellow-500/10' 
                    : 'bg-white/5 border-white/5 hover:bg-white/10 hover:border-white/10'
                }`;

                trackCard.onclick = () => {
                    loadTrack(index);
                    playTrack();
                };

                trackCard.innerHTML = `
                    <div class="relative w-12 h-12 rounded-xl overflow-hidden shrink-0">
                        <img src="${track.cover}" alt="${track.title}" class="w-full h-full object-cover">
                        ${isActive && isPlaying ? `
                            <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
                                <div class="flex items-end gap-0.5 h-4">
                                    <div class="eq-bar"></div>
                                    <div class="eq-bar"></div>
                                    <div class="eq-bar"></div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold text-gray-100 truncate ${isActive ? 'text-yellow-400' : ''}">${track.title}</h4>
                        <p class="text-xs text-gray-400 truncate">${track.artist} • ${track.album}</p>
                    </div>
                    <div class="text-xs font-semibold text-gray-400">
                        ${track.duration}
                    </div>
                `;
                playlistView.appendChild(trackCard);
            });
        }

        function renderLyrics(lyrics) {
            lyricsLinesContainer.innerHTML = '';
            lyrics.forEach((item, i) => {
                const p = document.createElement('p');
                p.id = `lyric-line-${i}`;
                p.className = 'lyric-line text-sm sm:text-base font-serif italic py-1';
                p.innerText = item.text;
                lyricsLinesContainer.appendChild(p);
            });
        }

        function updateLyricsHighlight(currentTime) {
            const track = playlist[currentIndex];
            if (!track || !track.lyrics) return;

            let activeLineIndex = 0;
            for (let i = 0; i < track.lyrics.length; i++) {
                if (currentTime >= track.lyrics[i].time) {
                    activeLineIndex = i;
                }
            }

            track.lyrics.forEach((_, i) => {
                const lineEl = document.getElementById(`lyric-line-${i}`);
                if (lineEl) {
                    if (i === activeLineIndex) {
                        lineEl.classList.add('active');
                        lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        lineEl.classList.remove('active');
                    }
                }
            });
        }

        function switchRightTab(tab) {
            const playlistBtn = document.getElementById('tab-playlist-btn');
            const lyricsBtn = document.getElementById('tab-lyrics-btn');

            if (tab === 'playlist') {
                playlistView.classList.remove('hidden');
                lyricsView.classList.add('hidden');

                playlistBtn.className = "text-sm font-bold text-yellow-400 border-b-2 border-yellow-400 pb-1 mr-6 transition-all";
                lyricsBtn.className = "text-sm font-semibold text-gray-400 hover:text-gray-200 pb-1 transition-all";
            } else {
                playlistView.classList.add('hidden');
                lyricsView.classList.remove('hidden');

                lyricsBtn.className = "text-sm font-bold text-yellow-400 border-b-2 border-yellow-400 pb-1 transition-all";
                playlistBtn.className = "text-sm font-semibold text-gray-400 hover:text-gray-200 pb-1 mr-6 transition-all";
            }
        }

        function toggleLyricsDrawer() {
            switchRightTab('lyrics');
        }

        // --- VISUAL BACKGROUND CANVAS ENGINE ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let meshBlobs = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initThemeElements();
        }

        window.addEventListener('resize', resizeCanvas);

        // Theme Definitions
        function setThemeMode(mode) {
            themeMode = mode;
            document.querySelectorAll('[id^="btn-theme-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 rounded-full transition-all text-gray-400 hover:text-white";
            });
            const activeBtn = document.getElementById(`btn-theme-${mode}`);
            if (activeBtn) {
                activeBtn.className = "px-3 py-1.5 rounded-full transition-all text-yellow-400 bg-white/10 shadow";
            }
            initThemeElements();
        }

        function initThemeElements() {
            particles = [];
            meshBlobs = [];

            if (themeMode === 'mesh') {
                // โทนสี Deep Blue & Electric Indigo ตามภาพ
                const colors = [
                    'rgba(29, 78, 216, 0.45)',   // Royal Blue (น้ำเงินเข้มเข้ม)
                    'rgba(59, 130, 246, 0.35)',  // Electric Blue (ฟ้าสว่าง)
                    'rgba(67, 56, 202, 0.40)',   // Deep Indigo (ม่วงน้ำเงิน)
                    'rgba(14, 165, 233, 0.30)'   // Bright Cyan Glow (ฟ้าเรืองแสง)
                ];
                for (let i = 0; i < 6; i++) {
                    meshBlobs.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 250 + 200,
                        color: colors[i % colors.length],
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: (Math.random() - 0.5) * 0.8
                    });
                }
            } else if (themeMode === 'stars') {
                // Starry Night Dust
                for (let i = 0; i < 90; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 2 + 0.5,
                        alpha: Math.random(),
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3
                    });
                }
            } else if (themeMode === 'sunset') {
                // Horizon Waves / Sun Orbs
                meshBlobs.push({
                    x: width * 0.5,
                    y: height * 0.7,
                    radius: Math.min(width, height) * 0.4,
                    color: 'rgba(234, 88, 12, 0.35)',
                    vx: 0,
                    vy: 0
                });
                meshBlobs.push({
                    x: width * 0.5,
                    y: height * 0.8,
                    radius: Math.min(width, height) * 0.6,
                    color: 'rgba(147, 51, 234, 0.3)',
                    vx: 0,
                    vy: 0
                });
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            // Base Background Tint
            ctx.fillStyle = '#08070b';
            ctx.fillRect(0, 0, width, height);

            const speedMultiplier = isPlaying ? 1.6 : 1.0;

            if (themeMode === 'mesh' || themeMode === 'sunset') {
                meshBlobs.forEach(blob => {
                    blob.x += blob.vx * speedMultiplier;
                    blob.y += blob.vy * speedMultiplier;

                    if (blob.x < -100 || blob.x > width + 100) blob.vx *= -1;
                    if (blob.y < -100 || blob.y > height + 100) blob.vy *= -1;

                    const grad = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.radius);
                    grad.addColorStop(0, blob.color);
                    grad.addColorStop(1, 'rgba(0,0,0,0)');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            if (themeMode === 'stars') {
                particles.forEach(p => {
                    p.x += p.vx * speedMultiplier;
                    p.y += p.vy * speedMultiplier;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    ctx.fillStyle = `rgba(255, 235, 180, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            requestAnimationFrame(animateCanvas);
        }

        // Initialize Canvas & App on Load
        window.onload = function() {
            resizeCanvas();
            animateCanvas();
            loadTrack(0);
        };
    </script>
</body>
</html>
