<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เกียรติบัตรและใบประกาศนียบัตร | ธีรภัทร์ คำยวง</title>

  <!-- Bootstrap 3.4.1 & jQuery (เหมือนเดิม) -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- สไตล์หลักของเว็บ (ไม่ได้แก้) + สไตล์เฉพาะหน้านี้ (ไฟล์ใหม่) -->
  <link href="myy.css" rel="stylesheet">
  <link href="certificates.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-default navbar-fixed-top custom-nav">
  <div class="container">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-menu">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand brand-logo" href="index.html">TEERAPAT.K</a>
    </div>

    <div class="collapse navbar-collapse" id="navbar-menu">
      <ul class="nav navbar-nav navbar-right">
        <li><a href="index.html">← กลับหน้าหลัก</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="section-padding cert-main">
  <div class="container">
    <div class="section-title-wrap">
      <a href="index.html" class="back-link">← กลับหน้าหลัก</a>
      <h1 class="cert-page-title">เกียรติบัตรและใบประกาศนียบัตร</h1>
      <p>รวบรวมหลักฐานการเข้าร่วมกิจกรรม อบรม และพัฒนาทักษะด้านเทคโนโลยีสารสนเทศ</p>
    </div>

    <!-- การ์ดทั้งหมดจะถูกสร้างโดย certificates.js มาวางตรงนี้ -->
    <div id="cert-list" class="cert-grid"></div>

    <!-- ข้อความเมื่อยังไม่มีใบประกาศ (ซ่อนไว้ก่อน) -->
    <div id="cert-empty" class="cert-empty" hidden>
      <span class="glyphicon glyphicon-certificate"></span>
      <p>ยังไม่มีใบประกาศในขณะนี้ กรุณากลับมาดูใหม่ภายหลัง</p>
    </div>

    <noscript>
      <p class="cert-empty">กรุณาเปิดใช้งาน JavaScript ในเบราว์เซอร์เพื่อดูใบประกาศ</p>
    </noscript>
  </div>
</main>

<!-- MODAL (Popup) ตัวเดียว ใช้ร่วมกันทุกใบ -->
<div id="certModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="certModalTitle">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="ปิด"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title" id="certModalTitle"></h4>
      </div>
      <div class="modal-body text-center" id="certModalBody"></div>
      <div class="modal-footer">
        <span id="certModalActions"></span>
        <button type="button" class="btn btn-default" data-dismiss="modal">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container">
    <div class="row">
      <div class="col-sm-6 text-left">

      </div>
